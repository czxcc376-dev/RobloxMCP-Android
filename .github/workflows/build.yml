name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Node runtime (libnode.so)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libnode.so ]; then
            curl -sL -o node.deb "https://packages.termux.dev/apt/termux-main/pool/main/n/nodejs/nodejs_26.12.1_aarch64.deb"
            ar x node.deb
            tar xf data.tar.xz
            cp data/data/com.termux/files/usr/bin/node app/src/main/jniLibs/arm64-v8a/libnode.so
            chmod 755 app/src/main/jniLibs/arm64-v8a/libnode.so
          fi
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Build server bundle
        run: |
          set -e
          if [ ! -f app/src/main/assets/server.tar.gz ]; then
            curl -sL -o src.tgz "https://github.com/okenjioxx/executor-mcp-roblox/archive/refs/heads/main.tar.gz"
            tar xzf src.tgz
            cd executor-mcp-roblox-main
            npm install --no-audit --no-fund
            npm run build
            npm prune --omit=dev
            cd ..
            mkdir -p pkg/server
            cp -r executor-mcp-roblox-main/dist pkg/server/
            cp -r executor-mcp-roblox-main/node_modules pkg/server/
            cp executor-mcp-roblox-main/package.json pkg/server/
            cp executor-mcp-roblox-main/connector.luau pkg/server/
            mkdir -p app/src/main/assets
            tar czf app/src/main/assets/server.tar.gz -C pkg server
          fi
          ls -lh app/src/main/assets/

      - name: Copy connector asset
        run: |
          if [ ! -f app/src/main/assets/connector.luau ]; then
            curl -sL -o app/src/main/assets/connector.luau \
              "https://github.com/okenjioxx/executor-mcp-roblox/raw/main/connector.luau"
          fi
          ls -lh app/src/main/assets/

      - name: Generate debug keystore
        run: |
          set -e
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > release.jks
            echo "KEYSTORE_PATH=$PWD/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore release.jks -alias androiddebug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=RobloxMCP, OU=Dev, O=Milk, L=NA, S=NA, C=CN"
            echo "KEYSTORE_PATH=$PWD/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebug" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Gradle build
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.9 || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxMCP-Android-APK
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -e
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -sLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          export ANDROID_HOME=$SDK
          export ANDROID_SDK_ROOT=$SDK
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk ready"

      - name: Prepare Node runtime (libnode.so)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libnode.so ]; then
            B=https://packages.termux.dev/apt/termux-main
            fetch() { curl -sL -o p.deb "$B/$1"; ar x p.deb data.tar.xz; tar xf data.tar.xz; rm -f p.deb data.tar.xz control.tar.xz debian-binary; }
            fetch pool/main/n/nodejs/nodejs_26.12.1_aarch64.deb
            cp data/data/com.termux/files/usr/bin/node app/src/main/jniLibs/arm64-v8a/libnode.so
            fetch pool/main/z/zlib/zlib_1.3.2_aarch64.deb
            fetch pool/main/c/c-ares/c-ares_1.34.9_aarch64.deb
            fetch pool/main/libf/libffi/libffi_3.8.0_aarch64.deb
            fetch "pool/main/o/openssl/openssl_1%3A3.6.5_aarch64.deb"
            fetch pool/main/libi/libicu/libicu_78.3_aarch64.deb
            fetch pool/main/libs/libsqlite/libsqlite_3.54.1_aarch64.deb
            fetch "pool/main/libc/libc++/libc%2B%2B_30_aarch64.deb"
            L=data/data/com.termux/files/usr/lib
            J=app/src/main/jniLibs/arm64-v8a
            cp $L/libc++_shared.so $J/ ; cp $L/libcares.so $J/ ; cp $L/libffi.so $J/
            cp $(find $L -name 'libcrypto.so.3*' | head -1) $J/libcrypto.so
            cp $(find $L -name 'libssl.so.3*' | head -1) $J/libssl.so
            cp $(find $L -name 'libz.so.1.*' | head -1) $J/libz.so
            cp $(find $L -name 'libicudata.so.78.*' | head -1) $J/libicudata.so
            cp $(find $L -name 'libicui18n.so.78.*' | head -1) $J/libicui18n.so
            cp $(find $L -name 'libicuuc.so.78.*' | head -1) $J/libicuuc.so
            cp $(find $L -name 'libsqlite3.so.3*' | head -1) $J/libsqlite3.so
            chmod 755 $J/*
          fi
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Build server assets (no tarball)
        run: |
          set -e
          if [ ! -f app/src/main/assets/server/dist/interface/launcher.js ]; then
            curl -sL -o src.tgz "https://github.com/okenjioxx/executor-mcp-roblox/archive/refs/heads/main.tar.gz"
            tar xzf src.tgz
            cd executor-mcp-roblox-main
            npm install --no-audit --no-fund
            npm run build
            npm prune --omit=dev
            cd ..
            mkdir -p app/src/main/assets/server
            cp -r executor-mcp-roblox-main/dist app/src/main/assets/server/
            cp -r executor-mcp-roblox-main/node_modules app/src/main/assets/server/
            cp executor-mcp-roblox-main/package.json app/src/main/assets/server/
            cp executor-mcp-roblox-main/connector/connector.luau app/src/main/assets/server/connector.luau 2>/dev/null || \
              curl -sL -o app/src/main/assets/server/connector.luau \
                "https://raw.githubusercontent.com/okenjioxx/executor-mcp-roblox/main/connector/connector.luau"
          fi
          echo "files: $(find app/src/main/assets/server -type f | wc -l)"
          ls app/src/main/assets/server

      - name: Generate debug keystore
        run: |
          set -e
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > release.jks
            echo "KEYSTORE_PATH=$PWD/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore release.jks -alias androiddebug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=RobloxMCP, OU=Dev, O=Milk, L=NA, S=NA, C=CN"
            echo "KEYSTORE_PATH=$PWD/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebug" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Install Gradle
        run: |
          set -e
          curl -sLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d $HOME
          echo "$HOME/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Gradle build
        run: |
          set -e
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxMCP-Android-APK
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
